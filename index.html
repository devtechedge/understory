<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17130f" />
    <meta
      name="description"
      content="Understory is a living browser terrarium: a slow micro-forest of moss, fern and ghost fungus that you plant, tend and return to."
    />
    <meta property="og:title" content="Understory, a living vitrine" />
    <meta
      property="og:description"
      content="A persistent micro-forest in a glass case. Plant three species, read the light, mist the soil and keep a field journal. Everything grows in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://understory-vert.vercel.app/" />
    <meta
      property="og:image"
      content="https://understory-vert.vercel.app/og-card.png"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="A glass vitrine holding moss, a maidenhair fern and ghost fungus on dark soil beneath a warm lamp."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://understory-vert.vercel.app/og-card.png"
    />
    <meta
      name="twitter:image:alt"
      content="A glass vitrine holding moss, a maidenhair fern and ghost fungus on dark soil beneath a warm lamp."
    />
    <link rel="canonical" href="https://understory-vert.vercel.app/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta name="robots" content="index,follow" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Understory",
        "url": "https://understory-vert.vercel.app/",
        "description": "A living browser terrarium: a slow micro-forest of moss, fern and ghost fungus that you plant, tend and return to.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and Canvas 2D",
        "image": "https://understory-vert.vercel.app/og-card.png",
        "license": "https://github.com/devtechedge/understory/blob/main/LICENSE",
        "creator": {
          "@type": "Person",
          "name": "Devayan Mandal"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #17130f;
        color: #efe7d6;
      }
      #root {
        min-height: 100dvh;
      }
      .boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      }
      .boot-mark {
        width: 46px;
        height: 46px;
        color: #c9a15e;
        opacity: 0.85;
        margin-bottom: 6px;
      }
      .boot-title {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(40px, 7vw, 58px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .boot-tagline {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-size: 14px;
        color: #9e9280;
        margin: 2px 0 10px;
      }
      .boot-status {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-size: 13px;
        color: #9e9280;
        margin: 0;
      }
      .boot-rule {
        width: 52px;
        height: 1px;
        background: rgba(239, 231, 214, 0.28);
        margin-top: 10px;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Understory, a living vitrine</title>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg class="boot-mark" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M6 26 Q6 10 18 4 Q30 10 30 26" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".7"/>
          <path d="M5 26 H31" stroke="currentColor" stroke-width=".8" opacity=".35"/>
          <path d="M12 25 Q12 17 18 13 Q24 17 24 25 Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
          <path d="M18 13 V25" stroke="currentColor" stroke-width=".7" opacity=".65"/>
          <circle cx="18" cy="9" r="1.1" fill="currentColor"/>
        </svg>
        <p class="boot-title">Understory</p>
        <p class="boot-tagline">A vitrine for slow things</p>
        <p class="boot-status">Opening the vitrine</p>
        <span class="boot-rule"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
